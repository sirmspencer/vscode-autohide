# a v* tag runs the tests, packages the extension, attaches it to a github
# release, and publishes it to the vs code marketplace and open vsx.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: check version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version $version"
            exit 1
          fi
      - name: install
        run: npm ci
      - name: test
        run: npm test
      - name: package
        run: npx vsce package --out "vscode-autohide-${GITHUB_REF_NAME#v}.vsix"
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" *.vsix --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
      - name: publish to the vs code marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath *.vsix
      - name: publish to open vsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish *.vsix
